<style>
:root {
  /* Direction : nuit de braises. Surfaces sombres et froides, une seule couleur chaude (la braise) réservée à l'action.
     Typo condensée en capitales pour les titres, japonisante et sobre pour le texte.
     Mise en page : colonne mobile, l'illustration du héros occupe l'écran d'accueil, panneaux à coins biseautés. */
  --bg: #0a0b10;
  --s1: #11131b;
  --s2: #181b26;
  --line: rgba(255, 255, 255, .08);
  --line2: rgba(255, 255, 255, .16);
  --text: #ece6dc;
  --muted: #8b8fa1;
  --ember: #ff5a36;
  --ember2: #7cc4ff;
  --gold: #d9b56c;
  --good: #5fd39a;
  --bad: #ff6b6b;
  --font-d: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-b: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Segoe UI', sans-serif;
  --cut: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  --cut-s: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-b); font-size: 14px; line-height: 1.5; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible { outline: 2px solid var(--ember2); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.d { font-family: var(--font-d); letter-spacing: .06em; text-transform: uppercase; }

#app { height: 100%; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
#screens { flex: 1; position: relative; min-height: 0; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
.screen.on { display: flex; animation: enter .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pad { padding: 14px 16px 24px; }

/* boutons */
.btn { font-family: var(--font-d); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; padding: 12px 18px; background: var(--s2); color: var(--text); border-radius: var(--r-s); position: relative; transition: filter .15s, transform .1s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn::before { content: ''; position: absolute; inset: 0; border: 1px solid var(--line2); border-radius: var(--r-s); pointer-events: none; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.prime { background: linear-gradient(100deg, #1d6ff2, #3d9bff); color: #ffffff; }
.btn.prime::before { border-color: rgba(255, 255, 255, .25); }
.btn.big { font-size: 19px; padding: 16px 20px; width: 100%; }
.btn.ghost { background: transparent; }
.btn small { font-family: var(--font-b); letter-spacing: 0; text-transform: none; font-weight: 500; opacity: .75; font-size: 12px; }
.ib { width: 38px; height: 38px; display: grid; place-items: center; background: rgba(10, 11, 16, .6); border: 1px solid var(--line2); border-radius: var(--r-s); }
.ib svg { width: 18px; height: 18px; }

/* barre du haut */
.top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; position: relative; z-index: 3; }
.plv { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.plv .lv { width: 38px; height: 38px; display: grid; place-items: center; font-family: var(--font-d); font-weight: 700; font-size: 17px; background: rgba(10, 11, 16, .65); border: 1px solid var(--gold); border-radius: var(--r-s); color: var(--gold); }
.plv .xp { flex: 1; min-width: 0; }
.plv .xp b { font-family: var(--font-d); font-size: 12px; letter-spacing: .14em; font-weight: 600; color: var(--muted); display: block; }
.bar { height: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.cur { display: flex; align-items: center; gap: 5px; padding: 5px 9px; background: rgba(10, 11, 16, .65); border: 1px solid var(--line); font-family: var(--font-d); font-weight: 600; font-size: 14px; }
.cur svg { width: 15px; height: 15px; }

/* accueil */
#s-home { overflow: hidden; }
.homeart { position: absolute; inset: 0 0 110px 0; overflow: hidden; }
.homeart .art { width: 100%; height: 100%; display: block; }
.homeart::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,11,16,.55) 0%, rgba(10,11,16,0) 16%, rgba(10,11,16,0) 52%, rgba(10,11,16,.9) 82%, var(--bg) 100%); }
.homebody { position: relative; z-index: 2; margin-top: auto; padding: 0 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.tagline { font-family: var(--font-d); font-size: 12px; letter-spacing: .24em; color: var(--ember2); display: flex; gap: 10px; align-items: center; }
.tagline::before { content: ''; width: 22px; height: 1px; background: var(--ember2); }
.hname { font-family: var(--font-d); font-weight: 700; font-size: 76px; line-height: .82; letter-spacing: .04em; text-transform: uppercase; }
.htitle { font-size: 15px; color: var(--muted); margin-top: 2px; }
.hstats { display: flex; gap: 18px; margin-top: 4px; }
.hstats div { display: flex; flex-direction: column; }
.hstats small { font-family: var(--font-d); letter-spacing: .16em; color: var(--muted); font-size: 11px; }
.hstats b { font-family: var(--font-d); font-weight: 600; font-size: 22px; line-height: 1.1; }
.hstats b.pw { color: var(--gold); }
.nextst { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -6px; }
.nextst b { color: var(--text); font-weight: 500; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.proto { position: absolute; top: 62px; right: 14px; z-index: 3; font-family: var(--font-d); font-size: 11px; letter-spacing: .18em; color: var(--muted); border: 1px solid var(--line2); padding: 3px 8px; background: rgba(10, 11, 16, .6); }

/* navigation */
#nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--s1); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); }
#nav.hide { display: none; }
#nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; color: var(--muted); font-family: var(--font-d); font-weight: 600; letter-spacing: .14em; font-size: 11px; text-transform: uppercase; transition: color .15s; }
#nav button svg { width: 22px; height: 22px; }
#nav button[aria-current="page"] { color: var(--text); }
#nav button[aria-current="page"]::after { content: ''; position: absolute; top: -4px; left: 30%; right: 30%; height: 2px; background: var(--ember); }
#nav .badge { position: absolute; top: 6px; right: calc(50% - 18px); width: 7px; height: 7px; background: var(--ember); border-radius: 50%; }

/* titres de section */
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
.sh h2 { font-family: var(--font-d); font-weight: 700; font-size: 30px; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
.sh span { color: var(--muted); font-size: 12px; }
.lbl { font-family: var(--font-d); letter-spacing: .2em; font-size: 11.5px; color: var(--muted); text-transform: uppercase; margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
.lbl::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* fiche héros */
.hhead { position: relative; height: 210px; flex: none; overflow: hidden; }
.hhead .art { position: absolute; width: 105%; height: 430px; top: -70px; left: 14%; }
.hhead::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,11,16,.92) 0%, rgba(10,11,16,.55) 45%, rgba(10,11,16,0) 75%), linear-gradient(0deg, var(--bg) 0%, rgba(10,11,16,0) 40%); }
.hhead .in { position: absolute; left: 16px; bottom: 14px; right: 16px; z-index: 2; }
.hhead .hn { font-family: var(--font-d); font-weight: 700; font-size: 46px; line-height: .9; letter-spacing: .04em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-family: var(--font-d); letter-spacing: .12em; font-size: 11.5px; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--line2); background: rgba(10, 11, 16, .6); }
.chip.el { border-color: rgba(70, 150, 255, .5); color: #9fd0ff; }
.chip.ra { border-color: rgba(78, 163, 255, .5); color: #9ccbff; }
.lvrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.lvrow .lvn { font-family: var(--font-d); font-weight: 700; font-size: 15px; letter-spacing: .1em; }
.lvrow .bar { flex: 1; height: 5px; }
.lvrow .xpn { font-size: 11.5px; color: var(--muted); }
.tabs { display: flex; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.tabs button { padding: 12px 2px 10px; font-family: var(--font-d); font-weight: 600; letter-spacing: .08em; font-size: 13px; text-transform: uppercase; color: var(--muted); position: relative; }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"]::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--ember); }
.tabp { padding: 14px 16px 28px; animation: enter .22s ease; }
.roster { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.roster::-webkit-scrollbar { display: none; }
.rc { flex: none; width: 48px; height: 60px; position: relative; background: var(--s1); border-bottom: 2px solid var(--c); border-radius: var(--r-s); display: flex; align-items: flex-end; justify-content: center; font-size: 9px; color: var(--muted); padding-bottom: 3px; overflow: hidden; }
.rc.on { outline: 1px solid var(--ember); }
.rc .art { position: absolute; width: 140px; height: 175px; left: -46px; top: -30px; }
.rc .lk { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; opacity: .45; }
.rcnote { font-size: 12px; color: var(--muted); margin-top: 8px; }

.pow { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: linear-gradient(100deg, rgba(217, 181, 108, .14), rgba(217, 181, 108, .02)); border: 1px solid rgba(217, 181, 108, .3); }
.pow small { font-family: var(--font-d); letter-spacing: .2em; font-size: 11.5px; color: var(--gold); }
.pow b { font-family: var(--font-d); font-weight: 700; font-size: 28px; color: var(--gold); line-height: 1; }
.stats { display: flex; flex-direction: column; margin-top: 8px; }
.st { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.st .n { font-size: 13.5px; }
.st .v { font-family: var(--font-d); font-weight: 600; font-size: 18px; text-align: right; }
.st .v em { font-style: normal; color: var(--good); font-size: 13px; margin-left: 6px; }
.st .bar { grid-column: 1 / -1; height: 3px; }
.st .bar i { background: linear-gradient(90deg, var(--ember), var(--ember2)); }
.st .ds { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: none; }
.st[aria-expanded="true"] .ds { display: block; }

.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--s1); border: 1px solid var(--line); border-left: 3px solid var(--rc, var(--line2)); text-align: left; width: 100%; }
.slot .ic { width: 46px; height: 46px; flex: none; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc, #555) 30%, transparent), transparent 70%), var(--s2); border-radius: var(--r-s); }
.slot .ic svg { width: 26px; height: 26px; }
.slot .tx { flex: 1; min-width: 0; }
.slot .tx small { font-family: var(--font-d); letter-spacing: .16em; font-size: 11px; color: var(--muted); text-transform: uppercase; display: block; }
.slot .tx b { font-weight: 700; display: block; }
.slot .tx span { font-size: 12.5px; color: var(--muted); }
.slot .up { font-family: var(--font-d); font-weight: 700; color: var(--gold); font-size: 16px; }
.slot.empty { border-left-style: dashed; }

.tech { padding: 12px; background: var(--s1); border: 1px solid var(--line); margin-bottom: 8px; display: grid; grid-template-columns: 48px 1fr; gap: 4px 12px; }
.tech .ic { grid-row: span 2; width: 48px; height: 48px; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(47, 140, 255, .35), transparent 70%), var(--s2); border-radius: var(--r-s); }
.tech .ic svg { width: 28px; height: 28px; }
.tech .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tech .hd b { font-weight: 700; font-size: 15px; }
.tech .hd small { font-family: var(--font-d); letter-spacing: .14em; font-size: 11px; color: var(--ember2); text-transform: uppercase; white-space: nowrap; }
.tech p { margin: 0; font-size: 12.5px; color: #c8c2b8; grid-column: 2; }
.tech .ft { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.pips { display: flex; gap: 4px; }
.pips i { width: 14px; height: 4px; background: rgba(255, 255, 255, .12); }
.pips i.on { background: var(--ember2); }
.tech .meta { font-size: 11.5px; color: var(--muted); }
.cost { display: inline-flex; align-items: center; gap: 4px; }
.cost svg { width: 13px; height: 13px; }
.cost.no { color: var(--bad); }

.lore { padding: 14px; background: var(--s1); border-left: 2px solid var(--ember); margin-bottom: 8px; }
.lore h4 { font-family: var(--font-d); letter-spacing: .14em; font-size: 14px; text-transform: uppercase; margin-bottom: 4px; }
.lore p { margin: 0; font-size: 13.5px; color: #cfc8bd; }
.lore.locked { border-left-color: var(--line2); opacity: .6; }
.quest { font-size: 15px; font-style: italic; color: var(--text); padding: 4px 0 6px; }

/* sac */
.seg { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.seg button { padding: 6px 10px; font-family: var(--font-d); letter-spacing: .08em; font-size: 12.5px; text-transform: uppercase; border: 1px solid var(--line2); color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--text); border-color: var(--text); }
.items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.it { position: relative; aspect-ratio: 1; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 28%, transparent), transparent 70%), var(--s1); border: 1px solid var(--line); border-bottom: 2px solid var(--rc); display: grid; place-items: center; border-radius: var(--r-s); }
.it svg { width: 50%; height: 50%; }
.it .u { position: absolute; top: 4px; right: 6px; font-family: var(--font-d); font-weight: 700; font-size: 12px; color: var(--gold); }
.it .eq { position: absolute; bottom: 4px; left: 6px; font-family: var(--font-d); letter-spacing: .1em; font-size: 9.5px; color: var(--ember2); }
.it .nw { position: absolute; top: 6px; left: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); }
.mats { display: flex; flex-direction: column; gap: 8px; }
.mat { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--s1); border: 1px solid var(--line); }
.mat svg { width: 30px; height: 30px; flex: none; }
.mat b { display: block; font-weight: 700; }
.mat span { font-size: 12.5px; color: var(--muted); }
.mat .q { margin-left: auto; font-family: var(--font-d); font-weight: 700; font-size: 22px; }
.empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

/* épreuves */
.stmap { display: flex; flex-direction: column; gap: 8px; }
.stg { display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 12px; align-items: center; padding: 12px; background: var(--s1); border: 1px solid var(--line); text-align: left; width: 100%; position: relative; }
.stg .no { grid-row: span 2; font-family: var(--font-d); font-weight: 700; font-size: 26px; color: var(--muted); text-align: center; }
.stg b { font-weight: 700; font-size: 15px; }
.stg .rq { font-size: 12px; color: var(--muted); }
.stg .rq.ok { color: var(--good); }
.stg .rq.hard { color: var(--ember2); }
.stg .rq.vhard { color: var(--bad); }
.stars { grid-row: span 2; display: flex; gap: 2px; }
.stars svg { width: 14px; height: 14px; }
.stg.cur { border-color: rgba(47, 140, 255, .55); background: linear-gradient(100deg, rgba(47, 140, 255, .12), transparent 60%), var(--s1); }
.stg.cur .no { color: var(--ember); }
.stg.lock { opacity: .4; }
.stg.done .no { color: var(--text); }

/* feuille du bas */
.ov { position: absolute; inset: 0; z-index: 40; display: none; flex-direction: column; justify-content: flex-end; background: rgba(4, 4, 8, .7); backdrop-filter: blur(3px); }
.ov.on { display: flex; }
.ov.center { justify-content: center; padding: 16px; }
.sheet { background: var(--s1); border-top: 1px solid var(--line2); padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 88%; overflow-y: auto; animation: up .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .grip { width: 38px; height: 3px; background: var(--line2); margin: -6px auto 14px; }
.ihd { display: flex; gap: 14px; align-items: center; }
.ihd .it { width: 72px; flex: none; }
.ihd h3 { font-size: 20px; font-weight: 700; }
.ihd small { font-family: var(--font-d); letter-spacing: .14em; font-size: 12px; text-transform: uppercase; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.kv b { font-family: var(--font-d); font-weight: 600; font-size: 16px; }
.kv.main b { color: var(--gold); font-size: 20px; }
.kv .delta { font-size: 12px; margin-left: 6px; }
.kv .delta.p { color: var(--good); }
.kv .delta.m { color: var(--bad); }
.acts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.acts .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts.stack .row { grid-template-columns: 1fr; }
.hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* combat */
#s-fight { overflow: hidden; background: #000; }
.arena { position: relative; flex: 1 1 auto; min-height: 0; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 10px 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; pointer-events: none; }
.fb { display: flex; gap: 8px; align-items: center; }
.fb.r { flex-direction: row-reverse; text-align: right; }
.fb .face { width: 42px; height: 42px; flex: none; overflow: hidden; border-radius: var(--r-s); border: 1px solid var(--line2); background: #000; }
.fb .face svg { width: 100%; height: 100%; display: block; }
.fb .bars { flex: 1; min-width: 0; }
.fb .nm { font-family: var(--font-d); font-weight: 600; letter-spacing: .1em; font-size: 12px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb .nm small { color: var(--muted); font-weight: 500; }

.rew img { width: 36px; height: 36px; object-fit: cover; object-position: top; border-radius: var(--r-s); flex: none; }
.rew svg { width: 28px; height: 28px; flex: none; }

.rew .new { color: var(--gold); }
.loading3d { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
@media (max-width: 370px) { .coll { grid-template-columns: repeat(3, 1fr); } .hname2 { font-size: 46px; } }
#app > #gl { display: none; }

/* ===== objectifs, coffres, événement, marché ===== */
#nav button { letter-spacing: .08em; font-size: 10.5px; }
.shl { display: flex; align-items: center; gap: 8px; }
.ib.back2 { width: 34px; height: 34px; display: grid; place-items: center; background: var(--s2); border-radius: var(--r-s); }
.ib.back2 svg { width: 18px; height: 18px; }
.sdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); margin-left: 6px; vertical-align: middle; }
.hrow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.questw { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: var(--s1); border: 1px solid var(--line); text-align: left; }
.questw > svg { width: 30px; height: 30px; flex: none; color: var(--gold); }
.questw b { display: block; font-family: var(--font-d); letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
.questw span { font-size: 12px; color: var(--muted); }
.questw .qb { margin-top: 4px; }
.questw em { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--ember); color: #fff; font-style: normal; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.qb { height: 5px; background: rgba(255,255,255,.08); overflow: hidden; }
.qb i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--ember2)); }
.quest { display: flex; gap: 10px; align-items: center; padding: 11px 12px; background: var(--s1); border: 1px solid var(--line); margin-bottom: 8px; }
.quest .qt { flex: 1; min-width: 0; }
.quest .qt b { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
.quest .qt small { font-size: 11.5px; color: var(--muted); }
.quest .qr { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.quest.ready { border-color: rgba(124, 196, 255, .55); background: linear-gradient(100deg, rgba(124, 196, 255, .1), transparent 70%), var(--s1); }
.quest.done { opacity: .5; }
.quest.done .qb i { background: var(--good); }
.btn.small { font-size: 12px; padding: 7px 11px; letter-spacing: .08em; }
.okk { font-family: var(--font-d); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--good); }
.rws { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

.qbonus.ready { border-style: solid; border-color: rgba(235, 189, 82, .6); } .qbonus.done { opacity: .5; }
.login { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.lday { padding: 8px 6px; background: var(--s1); border: 1px solid var(--line); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 86px; }

.lday .rws { justify-content: center; }

.ctable { display: flex; flex-direction: column; gap: 6px; }

.ctable b { font-family: var(--font-d); letter-spacing: .1em; text-transform: uppercase; color: var(--cc); width: 62px; flex: none; }
.ctable span { font-size: 12px; color: var(--muted); }
.chl { display: flex; flex-direction: column; gap: 8px; }
.chi { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--s1); border: 1px solid color-mix(in srgb, var(--cc) 40%, transparent); }
.chi div { flex: 1; } .chi b { display: block; font-family: var(--font-d); letter-spacing: .1em; text-transform: uppercase; color: var(--cc); } .chi span { font-size: 12.5px; color: var(--muted); }
.bigc { filter: drop-shadow(0 0 22px color-mix(in srgb, var(--cc, #e2b45a) 60%, transparent)); }
.lbl { font-family: var(--font-d); letter-spacing: .16em; text-transform: uppercase; font-size: 12px; color: var(--muted); margin: 16px 0 8px; }
.evb { padding: 16px 14px; margin-bottom: 10px; background: radial-gradient(120% 140% at 100% 0, color-mix(in srgb, var(--ec) 35%, transparent), transparent 60%), var(--s1); border: 1px solid color-mix(in srgb, var(--ec) 45%, transparent); border-radius: var(--r); }
.evb small { font-family: var(--font-d); letter-spacing: .16em; color: var(--ec); font-size: 11.5px; }
.evb h2 { font-family: var(--font-d); font-size: 30px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.05; margin: 4px 0 6px; }
.evb span { font-size: 12.5px; color: var(--muted); }
.bossc { display: flex; gap: 12px; width: 100%; text-align: left; padding: 12px; background: linear-gradient(100deg, rgba(47, 140, 255, .14), transparent 70%), var(--s1); border: 1px solid rgba(47, 140, 255, .45); border-radius: var(--r); }
.bossc .th, .evc .th, .selrow .th, .offer .th { width: 64px; height: 76px; flex: none; overflow: hidden; border-radius: var(--r-s); background: var(--s2); }
.bossc .th img, .evc .th img, .selrow .th img, .offer .th img, .pk span img, .swres img { width: 100%; height: 130%; object-fit: cover; object-position: top; }
.bossc .bt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bossc small { font-family: var(--font-d); letter-spacing: .14em; color: var(--ember2); font-size: 11px; }
.bossc b { font-size: 15px; } .bossc span { font-size: 12px; color: var(--muted); }
.bossc .rec b { font-size: 13px; color: var(--gold); }
.tiers { display: flex; gap: 4px; margin: 4px 0 2px; }
.tiers div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; background: rgba(255,255,255,.04); border: 1px solid var(--line); opacity: .55; }
.tiers div.on { opacity: 1; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 15%, transparent); }
.tiers small { font-size: 10.5px; color: var(--text); }
.evlist { display: flex; flex-direction: column; gap: 8px; }
.evc { display: flex; gap: 10px; width: 100%; text-align: left; padding: 10px; background: var(--s1); border: 1px solid var(--line); }
.evc .th { width: 54px; height: 64px; }
.evc .ct { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.evc b { font-size: 14px; } .evc .ct > span { font-size: 12px; color: var(--muted); }
.evc .rq { font-size: 11.5px; } .evc .rq.ok { color: var(--good); } .evc .rq.hard { color: var(--ember2); } .evc .rq.vhard { color: var(--bad); }
.evc.done { opacity: .55; } .evc.done .rq { color: var(--good); }
.evc.fin { border-color: rgba(255, 138, 216, .5); background: linear-gradient(100deg, rgba(255, 138, 216, .1), transparent 70%), var(--s1); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags i { font-style: normal; font-family: var(--font-d); letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; padding: 1px 6px; border: 1px solid rgba(124, 196, 255, .45); color: var(--ember2); }
.rulebox { padding: 10px 12px; background: rgba(124, 196, 255, .07); border-left: 2px solid var(--ember2); display: flex; flex-direction: column; gap: 6px; }
.rulebox b { font-family: var(--font-d); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--ember2); }
.pick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.pk { flex: none; width: 82px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; background: var(--s1); border: 1px solid var(--line); }
.pk span { width: 64px; height: 64px; overflow: hidden; border-radius: var(--r-s); background: var(--s2); }
.pk b { font-size: 12px; } .pk small { font-size: 11px; color: var(--gold); }
.pk.on { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember) inset; }
.b3.locked { opacity: .28; filter: grayscale(1); }
.offers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.offer { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 12px 8px 10px; background: var(--s1); border: 1px solid var(--line); }
.offer .ico { width: 64px; height: 64px; display: grid; place-items: center; background: var(--s2); border-radius: var(--r-s); border-bottom: 2px solid var(--rc, transparent); }
.offer .ico svg { width: 38px; height: 38px; }
.offer b { font-size: 13.5px; } .offer small { font-size: 11.5px; color: var(--muted); min-height: 30px; }
.offer.deal { border-color: rgba(95, 211, 154, .55); }
.offer .dl { position: absolute; top: 6px; left: 6px; font-family: var(--font-d); font-weight: 700; font-size: 12px; padding: 1px 6px; background: var(--good); color: #06140c; }
.offer.sold { opacity: .45; }
.cur { display: inline-flex; align-items: center; gap: 4px; } .cur svg { width: 16px; height: 16px; }
.sh .cur { color: var(--gold); font-size: 16px; font-weight: 700; }
.cours { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.cours span { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border: 1px solid color-mix(in srgb, var(--ec) 45%, transparent); font-size: 12px; color: var(--ec); }
.cours b { color: var(--text); font-size: 12px; }
.tr { font-style: normal; font-size: 9px; color: var(--muted); } .tr.up { color: var(--good); } .tr.dn { color: var(--bad); }
.selrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--s1); border: 1px solid var(--line); margin-bottom: 6px; }
.selrow .th { width: 44px; height: 52px; } .selrow > div { flex: 1; min-width: 0; }
.selrow .ico { width: 44px; height: 44px; display: grid; place-items: center; background: var(--s2); border-radius: var(--r-s); border-bottom: 2px solid var(--rc); flex: none; } .selrow .ico svg { width: 28px; height: 28px; }
.selrow b { display: block; font-size: 13.5px; } .selrow small { font-size: 11.5px; color: var(--muted); }
.selrow .sb { display: flex; gap: 4px; flex: none; } .selrow .sb svg { width: 13px; height: 13px; }
.swap { padding: 12px; background: var(--s1); border: 1px solid var(--line); margin-bottom: 10px; }
.swap h4 { font-family: var(--font-d); letter-spacing: .12em; text-transform: uppercase; font-size: 15px; margin-bottom: 4px; }
.swap label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.swap select { font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--line2); padding: 9px 10px; border-radius: 0; }
.swap input[type=range] { width: 100%; accent-color: var(--ember); }
.swres { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 12px; }
.swres img { width: 56px; height: 64px; object-fit: cover; border-radius: var(--r-s); background: var(--s2); }
.swres span { font-family: var(--font-d); font-size: 22px; font-weight: 700; color: var(--gold); }
.soon { padding: 16px 14px; background: var(--s1); border: 1px dashed var(--line2); }
.soon h4 { font-family: var(--font-d); letter-spacing: .12em; text-transform: uppercase; font-size: 18px; margin-bottom: 6px; }
.soon p { font-size: 13px; margin: 0 0 8px; }
.soon .ghost { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; opacity: .35; }
.soon .ghost div { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--s2); }
.soon .ghost span { width: 36px; height: 40px; background: rgba(255,255,255,.08); } .soon .ghost i { flex: 1; height: 10px; background: rgba(255,255,255,.08); } .soon .ghost b { width: 60px; height: 22px; background: rgba(255,255,255,.08); }


/* =====================================================================
   DA « Nuit bleue » : noir profond, bleu électrique, verre fumé.
   Panneaux arrondis et translucides, une seule couleur d'action (le bleu),
   typo système nette (pas de police condensée), lignes fines.
   ===================================================================== */
:root {
  --bg: #03050a; --s1: rgba(12, 18, 30, .82); --s2: rgba(19, 29, 47, .86); --s3: #0a111d;
  --line: rgba(110, 160, 255, .13); --line2: rgba(110, 160, 255, .28);
  --text: #e9eff9; --muted: #8592a8;
  --ember: #2f8cff; --ember2: #7cc4ff; --acc: #2f8cff; --acc2: #7cc4ff; --acc3: #1558d6;
  --gold: #e3c27a; --bad: #ff4d6a; --good: #4fd6a0;
  --r: 14px; --r-s: 10px;
  --font-d: 'Barlow', 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-b: 'Inter', 'Segoe UI', 'SF Pro Text', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
}
html, body { height: 100%; height: 100dvh; background: #000; }
body { font-family: var(--font-b); letter-spacing: .005em; }
#app { max-width: none; width: 100%; height: 100%; height: 100dvh; isolation: isolate;
  background:
    radial-gradient(120% 55% at 50% -12%, rgba(32, 96, 214, .24), transparent 62%),
    radial-gradient(70% 45% at 100% 105%, rgba(18, 62, 170, .18), transparent 70%),
    linear-gradient(180deg, #060a14 0%, #020307 100%); }
#app::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(110, 160, 255, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(110, 160, 255, .04) 1px, transparent 1px);
  background-size: 34px 34px; -webkit-mask-image: radial-gradient(ellipse at 50% 25%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 25%, #000 20%, transparent 75%); }
.screen { background: transparent; }
.pad, .tabp, .homeinfo, .homebody { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
.d, .sh h2, .hname, .hname2, .hhead .hn, .chestov h3 { font-weight: 800; letter-spacing: .03em; }
.sh h2 { font-size: 26px; background: linear-gradient(180deg, #fff, #b9d6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hname2, .hname, .hhead .hn { background: linear-gradient(180deg, #ffffff 30%, #9cc8ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 12px rgba(20, 90, 230, .45)); }
.lbl { letter-spacing: .16em; font-weight: 700; font-size: 11px; color: #7f9cc7; }
.lbl::after { background: linear-gradient(90deg, var(--line2), transparent); }
.tagline { letter-spacing: .2em; font-weight: 700; }

/* boutons */
.btn { border-radius: var(--r-s); clip-path: none; font-weight: 700; letter-spacing: .07em; font-size: 14px; background: linear-gradient(180deg, rgba(30, 44, 70, .92), rgba(15, 23, 39, .92)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 4px 14px rgba(0, 0, 0, .35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.btn::before { border-radius: inherit; clip-path: none; border-color: var(--line2); }
.btn:hover { filter: brightness(1.12); }
.btn.prime { background: linear-gradient(180deg, #47a3ff 0%, #2079f5 50%, #1560dc 100%); color: #fff; box-shadow: 0 8px 26px rgba(29, 111, 242, .45), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -2px 0 rgba(0, 30, 90, .35); text-shadow: 0 1px 2px rgba(0, 20, 70, .45); }
.btn.prime::before { border-color: rgba(170, 215, 255, .5); }
.btn.prime small { opacity: .9; }
.btn.big { font-size: 17px; padding: 16px 20px; }
.btn.ghost { background: transparent; box-shadow: none; }
.ib { border-radius: 50%; background: rgba(10, 16, 28, .7); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
button:focus-visible, .gp-focus { outline: 2px solid #8fd0ff !important; outline-offset: 2px; box-shadow: 0 0 0 4px rgba(47, 140, 255, .35) !important; }

/* barre du haut, monnaies */
.top { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
.cur { border-radius: 999px; padding: 5px 11px; background: rgba(8, 14, 26, .72); border-color: var(--line2); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-weight: 700; }
.plv .lv { border-radius: 10px; border-color: rgba(124, 196, 255, .6); color: #cfe6ff; background: linear-gradient(180deg, rgba(40, 90, 180, .55), rgba(10, 20, 40, .75)); }
.plv .xp b { letter-spacing: .08em; }
.bar { border-radius: 4px; background: rgba(110, 160, 255, .12); }
.bar i { background: linear-gradient(90deg, #2f8cff, #8fd0ff); border-radius: 4px; }

/* panneaux en verre */
.slot, .tech, .lore, .mat, .stg, .res, .rgrid div, .lootl div, .pausebox, .chestw, .hcard, .awak, .stg2, .rew div, .questw, .quest, .qbonus, .lday, .ctable div, .chi, .evc, .pk, .offer, .selrow, .swap, .soon, .pow, .bossc, .evb {
  border-radius: var(--r); border-color: var(--line); -webkit-backdrop-filter: blur(12px) saturate(140%); backdrop-filter: blur(12px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 6px 20px rgba(0, 0, 0, .28); }
.slot, .stg2, .rew div { border-left-width: 1px; }
.pow { background: linear-gradient(100deg, rgba(227, 194, 122, .14), rgba(227, 194, 122, .03)); }
.chip { border-radius: 999px; padding: 3px 10px; }
.chip.el { border-color: rgba(70, 150, 255, .5); color: #9fd0ff; }
.sheet { border-radius: 20px 20px 0 0; background: linear-gradient(180deg, rgba(16, 25, 42, .96), rgba(7, 11, 20, .98)); border-top: 1px solid var(--line2); box-shadow: 0 -20px 60px rgba(0, 0, 0, .6); width: 100%; max-width: 640px; margin: 0 auto; }
.sheet .grip { border-radius: 3px; }
.ov { background: rgba(1, 3, 8, .72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ov.center > * { max-width: 520px; margin-left: auto; margin-right: auto; }

/* navigation : barre de verre, onglet actif en bleu */
#nav { background: rgba(6, 10, 19, .82); -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%); border-top: 1px solid var(--line2); }
#nav button { font-weight: 600; letter-spacing: .04em; font-size: 10.5px; text-transform: none; }
#nav button[aria-current="page"] { color: #fff; }
#nav button[aria-current="page"] svg { color: #6fb8ff; filter: drop-shadow(0 0 8px rgba(47, 140, 255, .8)); }
#nav button[aria-current="page"]::after { top: -5px; left: 34%; right: 34%; height: 3px; border-radius: 0 0 3px 3px; background: linear-gradient(90deg, #2f8cff, #8fd0ff); box-shadow: 0 0 12px rgba(47, 140, 255, .8); }
#nav .badge { background: var(--bad); box-shadow: 0 0 0 2px #060a13; }
.sdot { background: var(--bad); }
.tabs { background: rgba(4, 7, 14, .88); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.tabs button { letter-spacing: .05em; font-weight: 700; }
.tabs button[aria-selected="true"]::after { height: 3px; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, #2f8cff, #8fd0ff); box-shadow: 0 0 10px rgba(47, 140, 255, .7); }
.seg { border-radius: 999px; }
.seg button { border-radius: 999px; }

/* scènes 3D du menu */
.view3d { background: radial-gradient(ellipse at 50% 72%, #13305e 0%, #0a1426 48%, #03050a 100%); }
#s-home .view3d::after { background: linear-gradient(180deg, rgba(3, 5, 10, .55) 0%, rgba(3, 5, 10, 0) 18%, rgba(3, 5, 10, 0) 66%, #03050a 100%); }
.hhead::after { background: linear-gradient(90deg, rgba(3, 5, 10, .92) 0%, rgba(3, 5, 10, .5) 45%, rgba(3, 5, 10, 0) 75%), linear-gradient(0deg, #03050a 0%, rgba(3, 5, 10, 0) 40%); }
.homeart::after { background: linear-gradient(180deg, rgba(3, 5, 10, .55) 0%, rgba(3, 5, 10, 0) 16%, rgba(3, 5, 10, 0) 52%, rgba(3, 5, 10, .9) 82%, #03050a 100%); }

/* combat : HUD épuré */
.fb .face { border-radius: 10px; border-color: rgba(124, 196, 255, .45); }
.hpb { border-radius: 3px; clip-path: none; height: 10px; background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px rgba(110, 160, 255, .2); }
.pad3 { background: linear-gradient(180deg, rgba(6, 11, 22, .96), #020409); border-top: 1px solid var(--line2); }
.joy { border-color: rgba(110, 160, 255, .35); background: radial-gradient(circle, rgba(47, 140, 255, .12), rgba(47, 140, 255, .02) 70%); }
.joy .knob { background: radial-gradient(circle at 40% 35%, rgba(170, 215, 255, .55), rgba(47, 140, 255, .18)); border-color: rgba(143, 208, 255, .6); box-shadow: 0 0 16px rgba(47, 140, 255, .35); }
.b3 { background: rgba(20, 40, 75, .35); border-color: rgba(110, 160, 255, .35); }
.b3.dn { background: rgba(47, 140, 255, .35); }
#k-atk { background: radial-gradient(circle at 50% 35%, rgba(80, 160, 255, .6), rgba(29, 111, 242, .18)); border-color: rgba(143, 208, 255, .7); box-shadow: 0 0 22px rgba(47, 140, 255, .35); }

/* ---------- écran : plein écran en vertical comme en horizontal ---------- */
#s-fight .arena { flex: 1 1 auto; min-height: 0; }
.pausebox { max-height: calc(100dvh - 32px); overflow-y: auto; }
#fs svg { width: 18px; height: 18px; }
/* téléphone à l'horizontale : les commandes passent par-dessus l'arène, qui prend tout l'écran */
@media (orientation: landscape) and (max-height: 560px) {
  .pad3 { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: none; border: 0; pointer-events: none; }
  .pad3 .joy, .pad3 .b3 { pointer-events: auto; }
  .pad3 .joy { left: calc(28px + env(safe-area-inset-left)); bottom: 22px; width: 116px; height: 116px; background: radial-gradient(circle, rgba(47, 140, 255, .16), rgba(3, 6, 14, .35) 72%); }
  .pad3 .b3 { background: rgba(6, 14, 30, .5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #k-ult { top: auto; bottom: 168px; left: calc(36px + env(safe-area-inset-left)); }
  #k-atk, #k-tir, #k-dodge, #k-t1, #k-t2, #k-t3 { margin-right: env(safe-area-inset-right); }
  .hud { padding-left: calc(10px + env(safe-area-inset-left)); padding-right: calc(10px + env(safe-area-inset-right)); }
  .keys { display: none; }
  #s-home .view3d { inset: 0; }
  .fpause { top: 74px !important; bottom: auto !important; right: calc(12px + env(safe-area-inset-right)) !important; }
}

/* manette : élément sélectionné + message */
.gp-focus { position: relative; z-index: 2; }
#toast { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -20px); z-index: 80; padding: 9px 16px; border-radius: 999px; background: rgba(8, 16, 32, .9); border: 1px solid var(--line2); color: #dbeaff; font-weight: 600; font-size: 13px; opacity: 0; pointer-events: none; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0, 0, 0, .5); }
#toast.on { animation: toast 2.6s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -20px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -10px); } }

/* 4e technique (secrète) + disposition des boutons de combat */
.pad3 { height: 244px; }
#k-tir { right: 108px; bottom: 16px; }
#k-t1 { right: 104px; bottom: 86px; }
#k-t2 { right: 66px; bottom: 150px; }
#k-t3 { right: 136px; bottom: 150px; }
#k-t4 { right: 174px; bottom: 82px; width: 54px; height: 54px; border-style: dashed; }
#k-dodge { right: 14px; bottom: 122px; }
.b3.lock4 { opacity: .4; }
.b3.lock4 .ki { background: #1b2233; border-color: #5a6a85; color: #b7c3d8; }
.tech.secret { border-color: rgba(124, 196, 255, .35); background: linear-gradient(120deg, rgba(47, 140, 255, .12), rgba(12, 18, 30, .82) 55%); }
.tech .lk4 { color: #7cc4ff; font-weight: 700; font-size: 12px; }
@media (max-width: 380px) { #k-t4 { right: 166px; width: 48px; height: 48px; } #k-t3 { right: 128px; } }

/* ---------- mode entraînement ---------- */
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trio .btn { padding: 12px 6px; font-size: 13px; letter-spacing: .04em; }
.pickrow { display: flex; gap: 8px; }
.pickrow .btn { flex: 1; }
.trsel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.trsel .vs { align-self: center; font-weight: 800; font-size: 14px; letter-spacing: .1em; color: #7f9cc7; }
.trcard { position: relative; display: flex; flex-direction: column; align-items: stretch; overflow: hidden; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, rgba(20, 34, 58, .9), rgba(8, 13, 24, .9)); text-align: left; min-height: 176px; }
.trcard img { width: 100%; height: 118px; object-fit: cover; object-position: 50% 12%; display: block; }
.trcard > span { padding: 7px 10px 9px; display: flex; flex-direction: column; gap: 1px; }
.trcard small { font-size: 10px; letter-spacing: .14em; color: #7f9cc7; font-weight: 700; }
.trcard b { font-size: 16px; font-weight: 800; }
.trcard em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.trcard::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--ec); opacity: .8; }
.trcard.on { border-color: rgba(124, 196, 255, .8); box-shadow: 0 0 0 1px rgba(124, 196, 255, .5), 0 8px 26px rgba(29, 111, 242, .35); }
.trseg { display: grid; grid-template-columns: repeat(3, 1fr); }
.trseg button[disabled] { opacity: .35; }
.tgls { display: flex; flex-direction: column; gap: 6px; }
.tgl { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-s); background: var(--s1); border: 1px solid var(--line); text-align: left; }
.tgl b { display: block; font-size: 13.5px; font-weight: 700; }
.tgl small { color: var(--muted); font-size: 12px; }
.tgl .sw { flex: none; width: 40px; height: 23px; border-radius: 999px; background: rgba(110, 160, 255, .15); border: 1px solid var(--line2); position: relative; transition: background .2s; }
.tgl .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #9fb2cf; transition: transform .2s, background .2s; }
.tgl[aria-pressed="true"] .sw { background: linear-gradient(90deg, #1d6ff2, #47a3ff); border-color: rgba(170, 215, 255, .6); }
.tgl[aria-pressed="true"] .sw::after { transform: translateX(17px); background: #fff; }
.trgrid .hcard.sel { outline: 2px solid #7cc4ff; outline-offset: 1px; box-shadow: 0 0 18px rgba(47, 140, 255, .45); }
.trpanel { position: absolute; left: 50%; top: 78px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(4, auto); gap: 4px 14px; padding: 7px 14px; border-radius: 12px; background: rgba(4, 9, 20, .62); border: 1px solid var(--line2); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: none; white-space: nowrap; }
.trpanel div { display: flex; flex-direction: column; align-items: center; }
.trpanel small { font-size: 9px; letter-spacing: .14em; color: #7f9cc7; font-weight: 700; }
.trpanel b { font-size: 15px; font-weight: 800; color: #e8f2ff; }
.trpanel[hidden] { display: none; }
.trseg button { white-space: nowrap; font-size: 11.5px; letter-spacing: .03em; padding: 8px 6px; }
.tech { min-width: 0; overflow: hidden; }
.tech .sbadge { display: inline-block; margin: 0 6px 4px 0; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #cfe6ff; background: linear-gradient(90deg, rgba(29, 111, 242, .55), rgba(71, 163, 255, .35)); border: 1px solid rgba(143, 208, 255, .5); }

/* ---------- animation d'ouverture de coffre ---------- */
#ov-chest.cfxon { padding: 0; background: radial-gradient(ellipse at 50% 45%, rgba(10, 22, 46, .92), rgba(1, 2, 6, .97)); }
#chestov.cfx { position: absolute; inset: 0; width: auto; max-width: none; padding: calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); border: 0; border-radius: 0; background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 0; }
.cfx-cv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cfx-title { position: relative; z-index: 2; text-align: center; font-family: var(--font-d); font-weight: 800; font-size: 30px; letter-spacing: .05em; text-transform: uppercase; color: #fff; text-shadow: 0 0 22px var(--cc), 0 2px 8px #000; }
.cfx-title small { display: block; font-size: 11px; letter-spacing: .3em; color: var(--cc); font-weight: 800; }
.cfx-stage { position: relative; z-index: 2; flex: 1 1 auto; min-height: 0; width: 100%; display: grid; place-items: center; transition: flex .6s cubic-bezier(.2, .8, .2, 1), transform .6s; }
.cfx-stage.done { flex: 0 0 185px; }
.cfx-stage.done .cfx-chest { transform: scale(.5) !important; transition: transform .5s; }
.cfx-chest { width: min(68vw, 300px); aspect-ratio: 1; cursor: pointer; will-change: transform; }
.cfx-chest svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 14px 30px rgba(0, 0, 0, .6)); }
.cfx-flash { position: absolute; inset: -20%; z-index: 3; pointer-events: none; opacity: 0; }
.cfx-flash.on { animation: cfxflash .9s ease-out forwards; }
@keyframes cfxflash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
.cfx-hint { position: relative; z-index: 2; color: #9fb4d4; font-size: 13px; margin: 6px 0 0; animation: pulse 1.4s infinite; min-height: 18px; }
@keyframes pulse { 50% { opacity: .45; } }
.cfx-cards { position: relative; z-index: 4; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 7px; perspective: 900px; overflow-y: auto; }
.cfx-card { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: linear-gradient(100deg, color-mix(in srgb, var(--c) 22%, rgba(10, 18, 34, .92)), rgba(10, 18, 34, .92) 60%); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 25%, transparent); text-align: left; opacity: 0; transform: translateY(-90px) scale(.4) rotateX(80deg); animation: cfxcard .55s cubic-bezier(.2, 1.3, .3, 1) var(--d) forwards; }
.cfx-card img { width: 38px; height: 38px; object-fit: cover; object-position: top; border-radius: 8px; flex: none; }
.cfx-card svg { width: 30px; height: 30px; flex: none; }
.cfx-card span { font-weight: 700; font-size: 14px; }
.cfx-card em { margin-left: auto; font-style: normal; font-weight: 800; font-size: 10.5px; letter-spacing: .12em; color: var(--c); }
.cfx-card.hero { padding: 14px; border-width: 2px; background: linear-gradient(100deg, color-mix(in srgb, var(--c) 40%, rgba(10, 18, 34, .9)), rgba(10, 18, 34, .9)); animation-name: cfxhero; }
.cfx-card.hero img { width: 60px; height: 60px; }
.cfx-card.hero span { font-size: 17px; }
@keyframes cfxcard { 0% { opacity: 0; transform: translateY(-90px) scale(.4) rotateX(80deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes cfxhero { 0% { opacity: 0; transform: scale(2.2); filter: brightness(3); } 50% { opacity: 1; filter: brightness(1.8); } 100% { opacity: 1; transform: none; filter: none; } }
.cfx-foot { position: relative; z-index: 4; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; animation: up .3s both; }
.cfx-foot:empty { display: none; }

/* ---------- commandes de combat : attaque, spécial, ultime, garde, équipe, soin ---------- */
.pad3 { height: 236px; }
#k-atk { right: 16px; bottom: 26px; width: 88px; height: 88px; }
#k-sp { right: 118px; bottom: 28px; width: 66px; height: 66px; }
#k-ult { left: auto; top: auto; right: 112px; bottom: 116px; width: 62px; height: 62px; }
#k-guard { right: 22px; bottom: 130px; width: 66px; height: 66px; border-color: rgba(124, 196, 255, .55); }
#k-sw { left: 16px; top: 12px; width: 56px; height: 56px; }
#k-heal { left: 84px; top: 12px; width: 56px; height: 56px; }
.b3 .lb { font-weight: 700; }
#k-sp .lb { max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
#k-guard .gmr { position: absolute; inset: -4px; border-radius: 50%; background: conic-gradient(rgba(124, 196, 255, .85) calc(var(--gm, 1) * 1turn), rgba(255, 255, 255, .06) 0); -webkit-mask: radial-gradient(circle, transparent 62%, #000 64%); mask: radial-gradient(circle, transparent 62%, #000 64%); pointer-events: none; }
#k-guard.on { background: radial-gradient(circle at 50% 40%, rgba(124, 196, 255, .5), rgba(29, 111, 242, .2)); box-shadow: 0 0 22px rgba(124, 196, 255, .6); }
#k-guard.broken { opacity: .45; }
#k-guard.broken .gmr { background: conic-gradient(rgba(255, 110, 110, .8) calc(var(--gm, 1) * 1turn), rgba(255, 255, 255, .06) 0); }
#k-sw .swf { position: absolute; inset: 3px; border-radius: 50%; overflow: hidden; opacity: .55; pointer-events: none; }
#k-sw .swf img { width: 100%; height: 130%; object-fit: cover; object-position: top; }
#k-sw svg { position: relative; z-index: 1; filter: drop-shadow(0 1px 2px #000); }
#k-sw[hidden] { display: none; }
#k-heal .ki { background: #12331f; border-color: #5fd39a; }
.fb .tmp { display: flex; gap: 4px; margin: 2px 0 1px; min-height: 0; }
.fb.r .tmp { justify-content: flex-end; }
.fb .tmp i { width: 14px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .35); }
.fb .tmp i.on { background: #7cc4ff; box-shadow: 0 0 6px rgba(124, 196, 255, .8); }
.fb .tmp i.ko { background: rgba(255, 90, 90, .45); }
@media (orientation: landscape) and (max-height: 560px) {
  #k-sw { top: auto; bottom: 156px; left: calc(30px + env(safe-area-inset-left)); }
  #k-heal { top: auto; bottom: 156px; left: calc(96px + env(safe-area-inset-left)); }
  #k-ult { bottom: 118px; }
}
@media (max-width: 360px) { #k-sp { right: 110px; width: 60px; height: 60px; } #k-ult { right: 104px; } }
/* fiche héros : spécial + équipe */
.tech { position: relative; }
.tech .spk { position: absolute; top: 10px; right: 10px; z-index: 2; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(10, 18, 34, .8); color: #b9cbe6; }
.tech .spk.on { background: linear-gradient(180deg, #47a3ff, #1d6ff2); border-color: rgba(170, 215, 255, .6); color: #fff; }
.tech .spk[disabled] { opacity: .4; }
.tech .hd { padding-right: 110px; }
.tech.spon { border-color: rgba(124, 196, 255, .55); }
.pickrow .btn.on { border-color: rgba(124, 196, 255, .6); color: #cfe6ff; }
.teamrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
.tslot { position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, rgba(20, 34, 58, .9), rgba(8, 13, 24, .9)); text-align: left; min-height: 120px; }
.tslot::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--ec, var(--line2)); }
.tslot img { width: 100%; height: 78px; object-fit: cover; object-position: 50% 10%; }
.tslot span { padding: 5px 8px 7px; display: flex; flex-direction: column; }
.tslot small { font-size: 9.5px; letter-spacing: .14em; color: #7f9cc7; font-weight: 800; }
.tslot b { font-size: 13px; font-weight: 700; }
.tslot.empty { justify-content: center; border-style: dashed; }
.tslot.empty b { font-size: 11px; color: var(--muted); font-weight: 500; }
/* soins */
.heals { display: flex; flex-direction: column; gap: 7px; }
.healr { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--s1); border: 1px solid var(--line); }
.healr.on { border-color: color-mix(in srgb, var(--hc) 70%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--hc) 25%, transparent); }
.healr .ic { width: 36px; height: 36px; flex: none; display: grid; place-items: center; color: var(--hc); border-radius: 10px; background: color-mix(in srgb, var(--hc) 14%, transparent); }
.healr .ic svg { width: 24px; height: 24px; }
.healr > div { flex: 1; min-width: 0; }
.healr b { display: block; font-size: 14px; }
.healr small { color: var(--muted); font-size: 12px; }

/* ---------- accueil : 4 rubriques cliquables dans l'image ---------- */
#nav { display: none !important; }
#s-home .view3d { inset: 0 !important; }
#s-home .view3d::after { background: linear-gradient(180deg, rgba(3, 5, 10, .6) 0%, rgba(3, 5, 10, 0) 16%, rgba(3, 5, 10, 0) 45%, rgba(3, 5, 10, .88) 66%, #03050a 82%); }
#s-home .top .plv { text-align: left; background: none; border: 0; padding: 0; }
.hubs { position: absolute; left: 0; right: 0; top: calc(66px + env(safe-area-inset-top)); height: 40%; max-height: 330px; z-index: 2; pointer-events: none; }
.hub { pointer-events: auto; position: absolute; width: 112px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px 11px 10px; border-radius: 16px; text-align: left;
  background: linear-gradient(160deg, rgba(30, 60, 110, .55), rgba(6, 12, 26, .62)); border: 1px solid rgba(124, 196, 255, .32); -webkit-backdrop-filter: blur(10px) saturate(150%); backdrop-filter: blur(10px) saturate(150%);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .12); transition: transform .15s, box-shadow .2s; animation: hubin .5s cubic-bezier(.2, .9, .3, 1.2) both; }
.hub:active { transform: scale(.95); }
.hub:hover { box-shadow: 0 0 0 1px rgba(124, 196, 255, .55), 0 10px 34px rgba(29, 111, 242, .35); }
.hub .hi { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #dff0ff; background: linear-gradient(180deg, #3d9bff, #1558d6); box-shadow: 0 4px 14px rgba(29, 111, 242, .5), inset 0 1px 0 rgba(255, 255, 255, .35); }
.hub .hi svg { width: 22px; height: 22px; }
.hub b { display: block; font-family: var(--font-d); font-weight: 800; font-size: 15px; letter-spacing: .02em; }
.hub small { display: block; color: #a9bddb; font-size: 11px; line-height: 1.25; }
.hub .bdg, .qmini .bdg { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px #060a13, 0 0 10px rgba(255, 77, 106, .8); }
.hub.l1 { left: 12px; top: 0; } .hub.r1 { right: 12px; top: 0; animation-delay: .06s; }
.hub.l2 { left: 12px; top: 52%; animation-delay: .12s; } .hub.r2 { right: 12px; top: 52%; animation-delay: .18s; }
@keyframes hubin { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
#s-home .homeinfo { gap: 9px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
#s-home .hname2 { font-size: 44px; }
.strk { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; color: #ffcf7a; }
.row3 { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 8px; }
.chestw.sm { padding: 8px 10px; gap: 8px; border-radius: var(--r); }
.chestw.sm svg.cb2 { width: 34px; height: 34px; }
.chestw.sm span, .qmini span { display: flex; flex-direction: column; min-width: 0; }
.chestw.sm b, .qmini b { font-size: 13px; font-weight: 800; letter-spacing: .02em; text-transform: none; font-family: var(--font-d); }
.chestw.sm small, .qmini small { font-size: 11.5px; color: var(--muted); }
.qmini { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r); background: var(--s1); border: 1px solid var(--line); text-align: left; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.qmini > svg { width: 24px; height: 24px; flex: none; color: #7cc4ff; }
.modes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.modes .btn { flex-direction: column; gap: 3px; padding: 8px 2px 7px; font-size: 10.5px; letter-spacing: .02em; text-transform: none; font-weight: 700; }
.modes .btn svg { width: 20px; height: 20px; color: #8fd0ff; }
@media (max-width: 370px) { .modes { grid-template-columns: repeat(3, 1fr); } .hub { width: 102px; } #s-home .hname2 { font-size: 38px; } }
.setl { display: flex; flex-direction: column; gap: 8px; }
.setl .btn { justify-content: flex-start; gap: 12px; text-transform: none; letter-spacing: .02em; }
.setl .btn svg { width: 20px; height: 20px; }
/* retour à l'accueil sur les autres écrans */
.homeb { position: sticky; top: calc(10px + env(safe-area-inset-top)); z-index: 6; align-self: flex-start; flex: none; margin: 12px 0 -48px 14px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #dbeaff;
  background: rgba(10, 18, 34, .78); border: 1px solid var(--line2); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.homeb svg { width: 20px; height: 20px; }
.homeb + .pad .sh:first-child { padding-left: 48px; min-height: 40px; align-items: center; }

/* ---------- saison gratuite ---------- */
.passhd { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--r); background: linear-gradient(110deg, rgba(47, 140, 255, .22), rgba(12, 18, 30, .85) 70%); border: 1px solid rgba(124, 196, 255, .4); }
.passhd small { font-size: 10px; letter-spacing: .16em; color: #7f9cc7; font-weight: 800; display: block; }
.passhd b { font-family: var(--font-d); font-size: 34px; font-weight: 800; line-height: 1; }
.passhd b span { font-size: 15px; color: var(--muted); }
.pbar { flex: 1; position: relative; height: 22px; border-radius: 11px; background: rgba(110, 160, 255, .14); overflow: hidden; }
.pbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #1d6ff2, #7cc4ff); box-shadow: 0 0 14px rgba(47, 140, 255, .6); }
.pbar span { position: relative; z-index: 1; display: block; text-align: center; font-size: 11.5px; font-weight: 700; line-height: 22px; }
.passl { display: flex; flex-direction: column; gap: 6px; }
.passr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); opacity: .55; }
.passr.open { opacity: 1; border-color: rgba(124, 196, 255, .55); box-shadow: 0 0 14px rgba(47, 140, 255, .2); }

.passr.open .pn { background: linear-gradient(180deg, #47a3ff, #1d6ff2); }
.passr .rws { flex: 1; display: flex; flex-wrap: wrap; gap: 5px; }
.lockp svg { width: 18px; height: 18px; color: var(--muted); }
/* ---------- tour ---------- */
.tower { display: flex; flex-direction: column; gap: 6px; position: relative; }
.tfl { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); }
.tfl::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--ec); }
.tfl .tn { width: 34px; flex: none; text-align: center; font-family: var(--font-d); font-weight: 800; font-size: 18px; color: #9fb4d4; }
.tfl .th { width: 42px; height: 42px; flex: none; border-radius: 10px; overflow: hidden; background: #0a1220; }
.tfl .th img { width: 100%; height: 130%; object-fit: cover; object-position: top; }
.tfl > div { flex: 1; min-width: 0; }
.tfl b { display: block; font-size: 13.5px; }
.tfl .rws { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.tfl.done { opacity: .5; }
.tfl.now { border-color: rgba(124, 196, 255, .8); background: linear-gradient(100deg, rgba(47, 140, 255, .24), var(--s1) 70%); box-shadow: 0 0 22px rgba(47, 140, 255, .35); transform: scale(1.02); }
.tfl.boss .tn { color: #ffcf7a; }
.tfl.boss { border-color: rgba(227, 194, 122, .35); }

/* ---------- comptes, amis, club, en ligne ---------- */
.authw { min-height: calc(100dvh - 40px); display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 420px; margin: 0 auto; }
.alogo { text-align: center; margin-bottom: 10px; line-height: .9; }
.alogo small { display: block; font-family: var(--font-d); font-weight: 800; letter-spacing: .5em; font-size: 14px; color: #7cc4ff; }
.alogo b { display: block; font-family: var(--font-d); font-weight: 800; font-size: 64px; letter-spacing: .04em; background: linear-gradient(180deg, #fff 30%, #7cc4ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 24px rgba(29, 111, 242, .55)); }
.alogo span { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line2); font-weight: 800; font-size: 12px; letter-spacing: .2em; color: #9fd0ff; }
.aseg { display: grid; grid-template-columns: 1fr 1fr; }
.acard { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: linear-gradient(180deg, rgba(18, 28, 48, .9), rgba(8, 12, 22, .92)); border: 1px solid var(--line2); box-shadow: 0 14px 40px rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

.fld input:focus, .addf input:focus { border-color: #7cc4ff; box-shadow: 0 0 0 3px rgba(47, 140, 255, .25); }

.aerr { min-height: 18px; margin: 0; font-size: 13px; color: #ff9aa8; }
.btn.danger { color: #ff9aa8; }
.btn.prime.danger { background: linear-gradient(180deg, #ff6b7f, #d83a52); color: #fff; }
.addf { display: flex; gap: 8px; }
.addf input { flex: 1; min-width: 0; padding: 11px 12px; }

.clubh { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: linear-gradient(110deg, rgba(47, 140, 255, .2), var(--s1) 70%); border: 1px solid var(--line2); }
.clubh b { display: block; font-family: var(--font-d); font-weight: 800; font-size: 22px; }
.clubh small { color: var(--muted); font-size: 12px; }
.cboss { display: flex; gap: 12px; padding: 10px; border-radius: 14px; background: var(--s1); border: 1px solid rgba(227, 194, 122, .35); }
.cboss .th { width: 74px; height: 92px; flex: none; border-radius: 12px; overflow: hidden; background: #0a1220; }
.cboss .th img { width: 100%; height: 130%; object-fit: cover; object-position: top; }

.cboss b { font-family: var(--font-d); font-weight: 800; font-size: 17px; }

.ctiers span.ok { background: rgba(227, 194, 122, .25); color: #ffe3a3; }

.presets .btn { text-transform: none; letter-spacing: 0; font-size: 12.5px; padding: 7px 11px; border-radius: 999px; }
.feed { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; max-height: 220px; overflow-y: auto; padding: 8px 10px; border-radius: 12px; background: rgba(2, 5, 12, .5); border: 1px solid var(--line); }
.feed div { font-size: 13px; }
.feed small { margin-left: 6px; color: var(--muted); font-size: 11px; }

.pfa { width: 64px; height: 64px; border-radius: 16px; overflow: hidden; flex: none; border: 1px solid var(--line2); }

.pfh small { display: block; color: var(--muted); font-size: 12px; }
.wait { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; color: #cfe6ff; font-weight: 600; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(124, 196, 255, .25); border-top-color: #7cc4ff; animation: spin .8s linear infinite; }

.empty .btn { margin-left: 6px; }
.ver { text-align: center; margin: -6px 0 0; font-size: 11px; color: #5f708c; letter-spacing: .08em; }

        </div>

<script>
/* ===== Mini moteur 3D (WebGL) : cel shading + contours ===== */
const G3 = (function () {
  /* ---------- maths ---------- */
  const M = {
    ident() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
    mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
        o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
      }
      return o;
    },
    persp(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2), m = new Float32Array(16); m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m; },
    look(e, t, u) {
      let zx = e[0] - t[0], zy = e[1] - t[1], zz = e[2] - t[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
      let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
      const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
      const m = new Float32Array(16);
      m[0] = xx; m[1] = yx; m[2] = zx; m[4] = xy; m[5] = yy; m[6] = zy; m[8] = xz; m[9] = yz; m[10] = zz;
      m[12] = -(xx * e[0] + xy * e[1] + xz * e[2]); m[13] = -(yx * e[0] + yy * e[1] + yz * e[2]); m[14] = -(zx * e[0] + zy * e[1] + zz * e[2]); m[15] = 1;
      return m;
    },
    // rotation ordre YXZ (comme three.js) + translation + échelle uniforme
    compose(p, r, s) {
      const cx = Math.cos(r[0]), sx = Math.sin(r[0]), cy = Math.cos(r[1]), sy = Math.sin(r[1]), cz = Math.cos(r[2]), sz = Math.sin(r[2]);
      const m = new Float32Array(16);
      m[0] = (cy * cz + sy * sx * sz) * s; m[1] = (cx * sz) * s; m[2] = (-sy * cz + cy * sx * sz) * s;
      m[4] = (-cy * sz + sy * sx * cz) * s; m[5] = (cx * cz) * s; m[6] = (sy * sz + cy * sx * cz) * s;
      m[8] = (sy * cx) * s; m[9] = (-sx) * s; m[10] = (cy * cx) * s;
      m[12] = p[0]; m[13] = p[1]; m[14] = p[2]; m[15] = 1;
      return m;
    },
    xform(m, v) { return [m[0] * v[0] + m[4] * v[1] + m[8] * v[2] + m[12], m[1] * v[0] + m[5] * v[1] + m[9] * v[2] + m[13], m[2] * v[0] + m[6] * v[1] + m[10] * v[2] + m[14]]; }
  };
  const V = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: a => Math.hypot(a[0], a[1], a[2]), norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]
  };

  /* ---------- géométrie ---------- */
  // grille paramétrique : f(i, j) -> {p:[x,y,z], uv:[u,v]} ; normales lissées et soudées
  function grid(nu, nv, f, opt) {
    opt = opt || {};
    const pos = [], uv = [], idx = [];
    for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) { const r = f(i / nu, j / nv); pos.push(r.p[0], r.p[1], r.p[2]); uv.push(r.uv ? r.uv[0] : i / nu, r.uv ? r.uv[1] : j / nv); }
    const keep = opt.keep;
    for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
      const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
      if (keep && !keep(i, j, nu, nv)) continue;
      if (opt.flip) idx.push(a, b, c, b, d, c); else idx.push(a, c, b, b, c, d);
    }
    return finalize(pos, uv, idx);
  }
  function finalize(pos, uv, idx) {
    const n = pos.length / 3, nor = new Float32Array(n * 3);
    for (let k = 0; k < idx.length; k += 3) {
      const a = idx[k] * 3, b = idx[k + 1] * 3, c = idx[k + 2] * 3;
      const e1 = [pos[b] - pos[a], pos[b + 1] - pos[a + 1], pos[b + 2] - pos[a + 2]], e2 = [pos[c] - pos[a], pos[c + 1] - pos[a + 1], pos[c + 2] - pos[a + 2]];
      const fn = V.cross(e1, e2);
      [a, b, c].forEach(q => { nor[q] += fn[0]; nor[q + 1] += fn[1]; nor[q + 2] += fn[2]; });
    }
    // soudure des normales aux coutures
    const map = new Map();
    for (let q = 0; q < n; q++) {
      const key = Math.round(pos[q * 3] * 2000) + ',' + Math.round(pos[q * 3 + 1] * 2000) + ',' + Math.round(pos[q * 3 + 2] * 2000);
      if (!map.has(key)) map.set(key, []); map.get(key).push(q);
    }
